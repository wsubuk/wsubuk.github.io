<body>
<h1>Oblicz BMI</h1>
<hr>
<script language="JavaScript">

function dziel() {
/* Odwołanie do formularza i jego elementów przez nazwę*/
var skl1=parseFloat(document.kuba.a.value);
var skl2=parseFloat(document.kuba.b.value);
var wynik = skl1/(skl2*skl2);
if((wynik)<=18.5) {alert("niedowaga" <br>  wynik)}
if((wynik)>=18.5 && (wynik)<=25) {alert("dobre bmi" <br>  wynik)}
if((wynik)>=25){ alert("nadwaga" <br>  wynik)};
}
</script>

<form name="kuba">
waga w kg<input type="Text" name="a"><br>
wzrost w metrach<input type="Text" name="b"><br>
<input type="Button" value="Oblicz BMI" onclick="dziel()">
</form>
<hr>

</body>
</html>
